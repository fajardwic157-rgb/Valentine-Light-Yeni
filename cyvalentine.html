<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Story Rahasia 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(180deg, #1b1b3a, #3a0f2e);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      text-align: center;
    }.rain, .hearts {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.drop {
  position: absolute;
  width: 2px;
  height: 15px;
  background: rgba(255,255,255,0.6);
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-20px); }
  to { transform: translateY(100vh); }
}

.heart {
  position: absolute;
  color: rgba(255,105,180,0.8);
  font-size: 16px;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(-10px); opacity: 1; }
  to { transform: translateY(100vh); opacity: 0; }
}

.card {
  background: rgba(255, 255, 255, 0.12);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  width: 90%;
  max-width: 380px;
  z-index: 2;
}

button {
  background: #ff4d6d;
  border: none;
  padding: 12px 18px;
  border-radius: 30px;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin: 5px;
  transition: 0.3s;
}

button:hover {
  background: #ff1e50;
  transform: scale(1.05);
}

  </style>
</head>
<body>  <div class="rain" id="rain"></div>
  <div class="hearts" id="hearts"></div>  <div class="card">
    <h1>Valentine Story 💕</h1>
    <p id="story">Malam itu hujan turun pelan. Light menatap layar ponsel, berharap ada pesan dari Yeni.</p>
    <div id="choices">
      <button onclick="nextStory()">Lanjutkan Cerita</button>
    </div>
  </div>  <script>
    let tap = 0;

    function nextStory() {
      const story = document.getElementById('story');
      const choices = document.getElementById('choices');

      story.innerText = "Light akhirnya mengirim pesan. Percakapan mengalir hangat, ditemani hujan dan detak rindu.";

      choices.innerHTML = `
        <button onclick="normalEnding()">Akhiri cerita</button>
        <button onclick="secretTap()">❤️</button>
      `;
    }

    function normalEnding() {
      document.getElementById('story').innerText = "Malam itu berakhir dengan senyum. Light tahu, hatinya selalu pulang ke Yeni.";
      document.getElementById('choices').innerHTML = `<p>💞 Happy Valentine Yeni 💞<br>Dari Light.</p>`;
    }

    function secretTap() {
      tap++;
      if (tap >= 5) secretEnding();
    }

    function secretEnding() {
      const story = document.getElementById('story');
      const choices = document.getElementById('choices');

      story.innerText = "🌙 ENDING RAHASIA 🌙\n\n'Yeni, mungkin hujan akan berhenti. Tapi perasaanku ke kamu nggak akan.'\n\n'Aku milih kamu, hari ini, besok, dan seterusnya.' 💖";

      choices.innerHTML = `<p>💘 Selamat Valentine Yeni 💘<br>— Light</p>`;
    }

    // Rain
    for (let i = 0; i < 80; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + 'vw';
      drop.style.animationDuration = 0.5 + Math.random() + 's';
      document.getElementById('rain').appendChild(drop);
    }

    // Hearts
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 4 + Math.random() * 4 + 's';
      document.getElementById('hearts').appendChild(heart);
    }
  </script></body>
</html>`}]}
